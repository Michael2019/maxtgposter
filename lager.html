<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box;">
  <div id="simple-post-form" style="max-width: 560px; width: 100%; margin: auto; background: #ffffff; border-radius: 32px; padding: 24px; box-shadow: 0 12px 24px -10px rgba(0,0,0,0.1); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <style>
      #simple-post-form label {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
        font-size: 0.85rem;
        color: #374151;
      }
      #simple-post-form textarea,
      #simple-post-form input[type="file"],
      #simple-post-form select,
      #simple-post-form button {
        width: 100%;
        padding: 10px 14px;
        border-radius: 24px;
        font-size: 0.9rem;
        font-family: inherit;
        transition: 0.2s;
        margin-bottom: 16px;
        border: 1px solid #e5e7eb;
        background: #ffffff;
        box-sizing: border-box;
      }
      #simple-post-form textarea {
        resize: vertical;
      }
      #simple-post-form textarea:focus,
      #simple-post-form select:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
      }
      #simple-post-form select {
        appearance: none;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%236b7280" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
        background-repeat: no-repeat;
        background-position: right 14px center;
        background-size: 14px;
        cursor: pointer;
      }
      #simple-post-form input[type="file"] {
        padding: 8px 12px;
        background: #f9fafb;
        border: 1px dashed #d1d5db;
        cursor: pointer;
      }
      #simple-post-form input[type="file"]::file-selector-button {
        background: #6366f1;
        border: none;
        color: white;
        padding: 4px 12px;
        border-radius: 32px;
        margin-right: 12px;
        font-weight: 500;
        font-size: 0.8rem;
      }
      #simple-post-form button {
        background: #6366f1;
        color: white;
        font-weight: 700;
        letter-spacing: 0.3px;
        box-shadow: 0 6px 14px -6px rgba(99, 102, 241, 0.3);
        cursor: pointer;
        border: none;
        margin-top: 8px;
      }
      #simple-post-form button:hover {
        background: #4f46e5;
        transform: translateY(-1px);
      }
      #simple-post-form button:active {
        transform: translateY(1px);
      }
      #simple-post-form button:disabled {
        opacity: 0.6;
        transform: none;
        pointer-events: none;
      }
      #simple-post-form .status {
        margin-top: 16px;
        padding: 10px 16px;
        border-radius: 40px;
        font-weight: 500;
        text-align: center;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        color: #1f2937;
        font-size: 0.85rem;
        display: none;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 600px) {
        #simple-post-form {
          padding: 20px 16px;
        }
      }
    </style>

    <form id="postForm">
      <label for="user_text">📝 Текст поста</label>
      <textarea id="user_text" name="user_text" rows="6" placeholder="Введите текст поста..." required></textarea>

      <label for="media_files">🖼️ Фото и видео (до 5 шт.)</label>
      <input type="file" id="media_files" name="media_files" multiple accept="image/*,video/*">

      <label for="channel">📢 Канал (Telegram + MAX)</label>
   <select id="channel" name="channel" required>
      <option value="">-- Канал --</option>
      <option value="test" data-telegram="-1003547986217" data-max="-72270757000562">🔵 Тестовый канал</option>
      <option value="СОЛН" data-telegram="-1002265440531" data-max="-72220373405126">СОЛН ☀️</option>
      <option value="ГРАЖ" data-telegram="-1002230741730" data-max="-72220454997446">ГРАЖ 🚗</option>
      <option value="ДЫБ" data-telegram="-1003694491475" data-max="-75417084153286">ДЫБ 🦅</option>
      <option value="БЕР" data-telegram="-1002132174810" data-max="-72220627029446">БЕР 🏦</option>
      <option value="МАР" data-telegram="-1001974376961" data-max="-72220691713478">МАР 🔴</option>
      <option value="КОС" data-telegram="-1001707280364" data-max="-72220777958854">КОС 🚀</option>
      <option value="РОС" data-telegram="-1001939033374" data-max="-72220987280838">РОС 🇷🇺</option>
      <option value="КОМ" data-telegram="-1001514344312" data-max="-72221044035014">КОМ 🔑</option>
      <option value="АПТ" data-telegram="-1001921279740" data-max="-72221090041286">АПТ 💊</option>
      <option value="ЕСЕН" data-telegram="-1001981369423" data-max="-72221140176326">ЕСЕН ✍️</option>
      <option value="КАЗ" data-telegram="-1001952039872" data-max="-72221214690758">КАЗ 🕌</option>
    </select>
      <input type="hidden" name="form_type" value="camp">
      <input type="hidden" name="chat_id" id="telegram_chat_id">
      <input type="hidden" name="max_chat_id" id="max_chat_id">

      <button type="submit" id="submitBtn">🚀 Опубликовать</button>
    </form>
    <div id="status" class="status"></div>
  </div>
</div>

<script>
  (function() {
    const channelSelect = document.getElementById('channel');
    const telegramHidden = document.getElementById('telegram_chat_id');
    const maxHidden = document.getElementById('max_chat_id');

    function updateChannelIds() {
      const selectedOption = channelSelect.options[channelSelect.selectedIndex];
      if (selectedOption && selectedOption.value) {
        telegramHidden.value = selectedOption.dataset.telegram || '';
        maxHidden.value = selectedOption.dataset.max || '';
      } else {
        telegramHidden.value = '';
        maxHidden.value = '';
      }
    }

    channelSelect.addEventListener('change', updateChannelIds);
    updateChannelIds();

    const form = document.getElementById('postForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    function showStatus(message, type) {
      statusDiv.style.display = 'block';
      statusDiv.textContent = message;
      statusDiv.style.animation = 'fadeIn 0.2s';
      if (type === 'error') {
        statusDiv.style.background = '#fee2e2';
        statusDiv.style.color = '#b91c1c';
        statusDiv.style.borderColor = '#fecaca';
      } else if (type === 'success') {
        statusDiv.style.background = '#e0f2fe';
        statusDiv.style.color = '#075985';
        statusDiv.style.borderColor = '#bae6fd';
      } else {
        statusDiv.style.background = '#f1f5f9';
        statusDiv.style.color = '#0f172a';
        statusDiv.style.borderColor = '#e2e8f0';
      }
      if (type === 'success') {
        setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
      }
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const token = localStorage.getItem('access_token');
      if (!token) {
        showStatus('❌ Требуется авторизация. Перенаправление...', 'error');
        setTimeout(() => {
          window.location.href = 'https://robik.club/login/';
        }, 2000);
        return;
      }

      const userText = document.getElementById('user_text').value.trim();
      if (!userText || !channelSelect.value) {
        showStatus('Заполните текст поста и выберите канал.', 'error');
        return;
      }

      const formData = new FormData(form);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Публикация...';
      showStatus('Публикуем...', 'info');

      try {
        const response = await fetch('https://tildatest.onrender.com/post', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const result = await response.json();

        if (response.ok && result.ok) {
          showStatus('✅ Пост успешно опубликован!', 'success');
          form.reset();
          channelSelect.selectedIndex = 0;
          updateChannelIds();
        } else {
          if (response.status === 401) {
            showStatus('❌ Сессия истекла. Войдите снова.', 'error');
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            setTimeout(() => {
              window.location.href = 'https://robik.club/login';
            }, 2000);
          } else {
            showStatus('❌ Ошибка: ' + (result.error || result.description || 'Неизвестная ошибка'), 'error');
          }
        }
      } catch (error) {
        console.error(error);
        showStatus('❌ Ошибка соединения с сервером.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 Опубликовать';
      }
    });
  })();
</script>
