{% extends "base.html" %}
{% block title %}Шаблоны{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Шаблоны</h1>
  <a class="btn btn-primary" href="{{ url_for('admin.templates_create') }}">Добавить</a>
</div>
<div class="table-responsive card border-0 shadow-sm">
  <table class="table mb-0">
    <thead><tr><th>ID</th><th>Название</th><th>Категория</th><th></th></tr></thead>
    <tbody>
      {% for tpl in templates %}
      <tr>
        <td>{{ tpl.get('id', '') }}</td>
        <td>{{ tpl.get('name', '') }}</td>
        <td>{{ tpl.get('category', '') }}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('admin.templates_edit', row_number=tpl.get('row_number')) }}">Изменить</a>
          <form method="post" action="{{ url_for('admin.templates_delete', row_number=tpl.get('row_number')) }}" class="d-inline" onsubmit="return confirm('Удалить шаблон?');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-sm btn-outline-danger">Удалить</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
