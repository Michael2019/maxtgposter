{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="poster-wrap slide-up">
  <div class="poster-card">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 mb-0">{{ page_title }}</h1>
      <span class="badge text-bg-primary">Шаблонный режим</span>
    </div>
    <form action="/post" method="post" enctype="multipart/form-data" id="postForm" data-form-mode="test">
      {{ form.hidden_tag() }}
      <input type="hidden" name="form_type" value="{{ form_type }}">

      <div class="row g-3 form-grid">
        <div class="col-12">
          <label class="form-label">Категория</label>
          <select class="form-select form-pill" id="category" name="category" required>
            <option value="">-- Категория --</option>
            <option value="Робототехника ПМ4">Робототехника ПМ4</option>
            <option value="Робототехника ПМ5">Робототехника ПМ5</option>
            <option value="Робототехника 0ст">Робототехника 0ст</option>
            <option value="Робототехника 1ст">Робототехника 1ст</option>
            <option value="Робототехника 2ст">Робототехника 2ст</option>
            <option value="Робототехника 3ст">Робототехника 3ст</option>
            <option value="Робототехника 4ст">Робототехника 4ст</option>
            <option value="Робототехника 5ст">Робототехника 5ст</option>
            <option value="Робототехника 6ст">Робототехника 6ст</option>
            <option value="Робототехника 7ст">Робототехника 7ст</option>
            <option value="Робототехника 8ст">Робототехника 8ст</option>
            <option value="Робик 1">Робик 1</option>
            <option value="Робик 2">Робик 2</option>
            <option value="Scratch">Scratch</option>
            <option value="Python">Python</option>
            <option value="ОЛиП NEW">ОЛиП NEW</option>
            <option value="ОЛиП">ОЛиП</option>
            <option value="Хакер">Хакер</option>
            <option value="Юнити">Юнити</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Модуль</label>
          <select class="form-select form-pill" id="module" name="module" required>
            <option value="">-- Модуль --</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Занятие</label>
          <select class="form-select form-pill" id="lesson" name="lesson" required>
            <option value="">-- Занятие --</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">День недели</label>
          <select class="form-select form-pill" id="weekday" name="weekday" required>
            <option value="">-- День недели --</option>
            <option value="понедельник">Понедельник</option>
            <option value="вторник">Вторник</option>
            <option value="среда">Среда</option>
            <option value="четверг">Четверг</option>
            <option value="пятница">Пятница</option>
            <option value="суббота">Суббота</option>
            <option value="воскресенье">Воскресенье</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Время</label>
          <select class="form-select form-pill" id="time" name="time" required>
            <option value="">-- Время --</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">📢 Канал (Telegram + MAX)</label>
          <select class="form-select form-pill" id="channel" name="channel" required>
            <option value="">-- Канал --</option>
            {% for channel in channels %}
              <option
                value="{{ channel.get('name', '') }}"
                data-telegram="{{ channel.get('telegram_chat_id', channel.get('telegram_id', '')) }}"
                data-max="{{ channel.get('max_chat_id', channel.get('max_id', '')) }}"
              >{{ channel.get('emoji', '✨') }} {{ channel.get('label', channel.get('name', 'Канал')) }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">🖼️ Фото и видео (до 5 шт.)</label>
          <input id="media_files" name="media_files" type="file" class="form-control form-pill file-pill" multiple accept="image/*,video/*,image/heic,image/heif,.heic,.heif">
        </div>
      </div>

      <input type="hidden" name="chat_id" id="telegram_chat_id">
      <input type="hidden" name="max_chat_id" id="max_chat_id">
      <button type="button" class="btn btn-primary mt-3 px-4 w-100 w-md-auto" id="submitBtn">
        <span class="spinner-border spinner-border-sm d-none js-loader"></span>
        Опубликовать
      </button>
    </form>
  </div>
</div>

<div id="previewOverlay" class="preview-overlay d-none">
  <div class="preview-sheet">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h5 class="mb-0">Предпросмотр поста</h5>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="closePreviewBtn">✕</button>
    </div>
    <pre id="previewContent" class="mb-3 preview-content"></pre>
    <div class="d-flex gap-2 justify-content-end">
      <button type="button" class="btn btn-outline-secondary" id="cancelPreviewBtn">Отмена</button>
      <button type="button" class="btn btn-primary" id="confirmPublishBtn">✅ Подтверждаю публикацию</button>
    </div>
  </div>
</div>
{% endblock %}
