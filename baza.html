<!-- Подключаем системный шрифт -->
<style>
  .fullscreen-form {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: transparent;
    box-sizing: border-box;
    padding: 30px 20px 40px;   /* десктоп: отступ сверху 30px */
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow-y: auto;
  }

  #postForm {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border-radius: 32px;
    padding: 24px 24px;
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.1);
    color: #1f2937;
    box-sizing: border-box;
    margin: 0 auto;
  }

  #postForm label {
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
    font-size: 0.85rem;
    color: #374151;
  }

  #postForm select,
  #postForm input[type="file"],
  #postForm button {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    border-radius: 24px;
    font-size: 0.9rem;
    font-family: inherit;
    transition: 0.2s;
  }

  #postForm select {
    border: 1px solid #e5e7eb;
    background: #ffffff;
    color: #111827;
    appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%236b7280" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }

  #postForm select:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
  }

  #postForm input[type="file"] {
    padding: 8px 12px;
    background: #f9fafb;
    border: 1px dashed #d1d5db;
    cursor: pointer;
    margin-bottom: 16px;
  }

  #postForm input[type="file"]::file-selector-button {
    background: #6366f1;
    border: none;
    color: white;
    padding: 4px 12px;
    border-radius: 32px;
    margin-right: 12px;
    font-weight: 500;
    font-size: 0.8rem;
  }

  #postForm button {
    padding: 12px 20px;
    border: none;
    border-radius: 40px;
    background: #6366f1;
    color: white;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 6px 14px -6px rgba(99, 102, 241, 0.3);
    cursor: pointer;
    transition: 0.2s;
    margin-top: 8px;
  }

  #postForm button:hover {
    background: #4f46e5;
    transform: translateY(-1px);
  }

  #postForm button:active {
    transform: translateY(1px);
  }

  #postForm button:disabled {
    opacity: 0.6;
    transform: none;
    pointer-events: none;
  }

  #status {
    margin-top: 16px;
    padding: 10px 16px;
    border-radius: 40px;
    font-weight: 500;
    text-align: center;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    color: #1f2937;
    font-size: 0.85rem;
    width: 100%;
    max-width: 560px;
    box-sizing: border-box;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Мобильная адаптация: увеличиваем верхний отступ, чтобы форма была ниже */
  @media (max-width: 600px) {
    .fullscreen-form {
      padding: 55px 12px 30px;   /* на телефонах отступ сверху увеличен до 55px */
    }
    #postForm {
      padding: 20px 16px;
      border-radius: 28px;
    }
    #postForm select,
    #postForm input[type="file"] {
      margin-bottom: 12px;
    }
  }
</style>

    <button type="submit" id="submitBtn">🚀 Опубликовать</button>
  </form>
  <div id="status" style="display: none;"></div>

<script>
  // ---------- Логика зависимых списков ----------
  const categorySelect = document.getElementById('category');
  const moduleSelect = document.getElementById('module');
  const lessonSelect = document.getElementById('lesson');

  const months = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

  function updateModules() {
    const category = categorySelect.value;
    moduleSelect.innerHTML = '<option value="">-- Модуль --</option>';
    let moduleOptions = [];
    if (category === 'Робик 1' || category === 'Робик 2') {
      moduleOptions = months.map(m => ({ value: m, text: m.charAt(0).toUpperCase() + m.slice(1) }));
    } else {
      moduleOptions = [
        { value: '1', text: 'Модуль 1' },
        { value: '2', text: 'Модуль 2' }
      ];
    }
    moduleOptions.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt.value;
      option.textContent = opt.text;
      moduleSelect.appendChild(option);
    });
    updateLessons();
  }

  function updateLessons() {
    const module = moduleSelect.value;
    lessonSelect.innerHTML = '<option value="">-- Занятие --</option>';
    let maxLesson = 0;
    if (module === '1') {
      maxLesson = 17;
    } else if (module === '2') {
      maxLesson = 20;
    } else if (months.includes(module)) {
      maxLesson = 5;
    } else {
      return;
    }
    for (let i = 1; i <= maxLesson; i++) {
      const option = document.createElement('option');
      option.value = i.toString();
      option.textContent = 'Занятие ' + i;
      lessonSelect.appendChild(option);
    }
  }

  categorySelect.addEventListener('change', updateModules);
  moduleSelect.addEventListener('change', updateLessons);

  (function init() {
    if (categorySelect.value) {
      updateModules();
    } else {
      moduleSelect.innerHTML = '<option value="">-- Модуль --</option>';
      const defaultModules = [
        { value: '1', text: 'Модуль 1' },
        { value: '2', text: 'Модуль 2' }
      ];
      defaultModules.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt.value;
        option.textContent = opt.text;
        moduleSelect.appendChild(option);
      });
    }
  })();

  // ---------- Генерация времени ----------
  const timeSelect = document.getElementById('time');
  for (let hour = 10; hour <= 20; hour++) {
    for (let minute = 0; minute < 60; minute += 15) {
      if (hour === 20 && minute > 0) break;
      const hourStr = hour.toString().padStart(2, '0');
      const minuteStr = minute.toString().padStart(2, '0');
      const timeValue = `${hourStr}:${minuteStr}`;
      const option = document.createElement('option');
      option.value = timeValue;
      option.textContent = timeValue;
      timeSelect.appendChild(option);
    }
  }

  // ---------- Каналы ----------
  const channelSelect = document.getElementById('channel');
  const telegramHidden = document.getElementById('telegram_chat_id');
  const maxHidden = document.getElementById('max_chat_id');

  channelSelect.addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    if (selectedOption && selectedOption.value) {
      telegramHidden.value = selectedOption.dataset.telegram || '';
      maxHidden.value = selectedOption.dataset.max || '';
    } else {
      telegramHidden.value = '';
      maxHidden.value = '';
    }
  });

  // ---------- Отправка ----------
  document.getElementById('postForm').addEventListener('submit', async function(event) {
    event.preventDefault();

    const token = localStorage.getItem('access_token');
    if (!token) {
      showStatus('❌ Требуется авторизация. Перенаправление...', 'error');
      setTimeout(() => {
        window.location.href = 'https://robik.club/login/';
      }, 2000);
      return;
    }

    const form = event.target;
    const formData = new FormData(form);
    const submitBtn = document.getElementById('submitBtn');

    if (!formData.get('category') || !formData.get('module') || !formData.get('lesson') ||
        !formData.get('weekday') || !formData.get('time') || !formData.get('chat_id')) {
      showStatus('Заполните все поля и выберите канал.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Публикация...';
    showStatus('Публикуем...', 'info');

    try {
      const response = await fetch('https://tildatest.onrender.com/post', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });

      const result = await response.json();

      if (response.ok && result.ok) {
        showStatus('✅ Пост успешно опубликован!', 'success');
        form.reset();
        telegramHidden.value = '';
        maxHidden.value = '';
        channelSelect.selectedIndex = 0;
        categorySelect.value = '';
        updateModules();
        document.getElementById('weekday').selectedIndex = 0;
        document.getElementById('time').selectedIndex = 0;
      } else {
        if (response.status === 401) {
          showStatus('❌ Сессия истекла. Войдите снова.', 'error');
          localStorage.removeItem('access_token');
          localStorage.removeItem('user');
          setTimeout(() => {
            window.location.href = 'https://robik.club/login';
          }, 2000);
        } else {
          showStatus('❌ Ошибка: ' + (result.description || 'Неизвестная ошибка'), 'error');
        }
      }
    } catch (error) {
      console.error(error);
      showStatus('❌ Ошибка соединения с сервером.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '🚀 Опубликовать';
    }
  });

  function showStatus(message, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    statusDiv.textContent = message;
    statusDiv.style.animation = 'fadeIn 0.2s';
    if (type === 'error') {
      statusDiv.style.background = '#fee2e2';
      statusDiv.style.color = '#b91c1c';
      statusDiv.style.borderColor = '#fecaca';
    } else if (type === 'success') {
      statusDiv.style.background = '#e0f2fe';
      statusDiv.style.color = '#075985';
      statusDiv.style.borderColor = '#bae6fd';
    } else {
      statusDiv.style.background = '#f1f5f9';
      statusDiv.style.color = '#0f172a';
      statusDiv.style.borderColor = '#e2e8f0';
    }
  }
</script>
